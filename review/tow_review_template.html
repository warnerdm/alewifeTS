<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alewife tow review</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/plotly.js/2.35.3/plotly.min.js"></script>
<style>
/* Two panes: sortable tow table (left), selected tow's five review sections (right). */
:root {
  --bg: #f4f6f7; --panel: #ffffff; --fg: #1b2328; --muted: #5d6b73; --line: #d6dde1;
  --accent: #1f5f7a; --accent-soft: #e2edf2; --sel: #fdf3d8;
  --sans: "Segoe UI", system-ui, -apple-system, sans-serif; --mono: Consolas, "Courier New", monospace;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 13px/1.45 var(--sans); }
header { display: flex; flex-wrap: wrap; gap: 6px 18px; align-items: baseline; padding: 10px 16px;
         background: var(--panel); border-bottom: 1px solid var(--line); }
header h1 { font-size: 16px; margin: 0; }
header .note { color: var(--muted); }
header code { font: 12px var(--mono); background: var(--accent-soft); padding: 1px 4px; border-radius: 3px; }
main { display: grid; grid-template-columns: minmax(420px, 44%) 1fr; height: calc(100% - 46px); }
#left { overflow: auto; border-right: 1px solid var(--line); background: var(--panel); }
#right { overflow: auto; padding: 12px 16px 40px; min-width: 0; }
.controls { display: flex; gap: 8px; padding: 8px 10px; position: sticky; top: 0; background: var(--panel);
            border-bottom: 1px solid var(--line); z-index: 2; flex-wrap: wrap; }
.controls input, .controls select { font: inherit; padding: 3px 6px; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th, td { padding: 4px 6px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }
thead th { position: sticky; top: var(--controls-h, 41px); z-index: 1; background: var(--accent-soft); cursor: pointer; font-weight: 600;
           font-size: 11.5px; user-select: none; }
thead th .arr { color: var(--accent); }
tbody tr { cursor: pointer; }
tbody tr:hover { background: #eef3f5; }
tbody tr.sel { background: var(--sel); }
h2 { font-size: 15px; margin: 0 0 4px; }
h3 { font-size: 13px; margin: 18px 0 6px; padding-bottom: 3px; border-bottom: 2px solid var(--accent); color: var(--accent); }
.sub { color: var(--muted); margin-bottom: 6px; }
.kv { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 2px 18px; }
.kv div { display: flex; justify-content: space-between; gap: 8px; border-bottom: 1px dotted var(--line); padding: 2px 0; }
.kv span:first-child { color: var(--muted); }
.kv span:last-child { font-variant-numeric: tabular-nums; }
.plots { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.plot { background: var(--panel); border: 1px solid var(--line); min-height: 260px; }
.wide { grid-column: 1 / -1; }
.img { background: var(--panel); border: 1px solid var(--line); padding: 4px; }
.img img { width: 100%; display: block; }
.img .cap { color: var(--muted); font-size: 11.5px; padding: 2px 2px 0; }
.small { font-size: 12px; }
table.mini { width: auto; }
table.mini th { position: static; cursor: default; }
.empty { color: var(--muted); padding: 30px; }
.warn { color: #8a4b00; }
.decision { background: var(--sel); border: 1px solid #e8d69a; border-radius: 4px; padding: 8px 10px; margin: 8px 0 4px; }
.decision div + div { margin-top: 3px; }
.tc-tag{font-size:12px;font-weight:600;padding:2px 8px;border-radius:10px;background:#fff0d6;color:#8a5200;vertical-align:middle}
.tc-note{font-size:13px;color:#8a5200;background:#fff8ea;border:1px solid #f1d9a8;border-radius:6px;padding:4px 8px;margin:4px 0}
</style>
</head>
<body>
<header>
  <h1>Alewife tow review</h1>
  <span class="note">Read-only: record decisions in <code>config/tow_review.csv</code> (decision: include / exclude; reason: <span id="reasons"></span>). All from pydt4.</span>
  <span class="note">Built __BUILT__ by <code>review/build_tow_review.py</code>.</span>
</header>
<main>
  <section id="left">
    <div class="controls">
      <input id="q" type="search" placeholder="OP_ID, lake, year, vessel..." aria-label="Filter tows">
      <select id="grp" aria-label="Depth group"><option value="all">all depths</option><option value="shallow">FISHING_DEPTH &lt; 40 m</option><option value="deep">&ge; 40 m</option></select>
      <select id="tc" aria-label="Time corrected"><option value="all">all start times</option><option value="yes">time corrected</option><option value="no">not corrected</option></select>
      <select id="lake" aria-label="Format"><option value="all">dt4 and Simrad</option><option value="dt4">dt4</option><option value="Simrad">Simrad</option></select>
      <span id="count" class="note"></span>
    </div>
    <table id="tows"><thead></thead><tbody></tbody></table>
  </section>
  <section id="right"><div class="empty">Select a tow in the table.</div></section>
</main>
<script>
const DATA = /*__DATA__*/null;
const REASONS = /*__REASONS__*/null;
if (document.getElementById("reasons")) document.getElementById("reasons").textContent = REASONS.join("; ");
for (const d of DATA) d.time_corrected = d.start_correction ? "yes" : "";
const COLS = [
  ["OP_ID", "OP_ID", 0], ["time_corrected", "Time corrected", null], ["year", "Year", 0], ["vessel", "Vessel", 0], ["format", "Format", null],
  ["fishing_depth", "Depth m", 1], ["targets_used", "Targets", 0], ["fish_tracks", "Fish", 0],
  ["ts_mean", "TS mean", 2], ["mean_minus_median", "Mean−median", 2], ["strongest_fish_above_median", "Top fish − median", 1],
  ["masked_targets", "Masked", 0], ["alewife_n", "Alewife measured", 0], ["alewife_len_max", "Largest alewife mm", 0], ["nv_pydt4", "Nv", 4], ["frac_in_tracks", "In tracks", 2], ["bottom_clearance", "Bottom − region", 1], ["no_pick_pings", "No-pick pings", 0],
  ["speed_kn", "Speed kn", 1], ["data_before_min", "Data before min", 1], ["data_after_min", "Data after min", 1],
];
// A shared copy carries the reviewer's decisions (d.review): show them as a column and at the top of each tow.
if (DATA.some(d => d.review)) {
  for (const d of DATA) d.decision = d.review ? d.review.decision : null;
  COLS.splice(1, 0, ["decision", "Decision", null]);
}
let sortKey = "year", sortDir = 1, selected = null;
const fmt = (v, d) => v === null || v === undefined || v === "" ? "–" : (typeof v === "number" && d !== null ? v.toFixed(d) : String(v));

function buildHead() {
  const tr = document.createElement("tr");
  for (const [k, lab] of COLS) {
    const th = document.createElement("th");
    th.textContent = lab + " ";
    const a = document.createElement("span"); a.className = "arr";
    a.textContent = k === sortKey ? (sortDir > 0 ? "▲" : "▼") : "";
    th.appendChild(a);
    th.onclick = () => { sortDir = k === sortKey ? -sortDir : 1; sortKey = k; render(); };
    tr.appendChild(th);
  }
  const thead = document.querySelector("#tows thead"); thead.innerHTML = ""; thead.appendChild(tr);
}
function render() {
  buildHead();
  const q = document.getElementById("q").value.trim().toLowerCase();
  const g = document.getElementById("grp").value;
  const lk = document.getElementById("lake").value;
  const tc = document.getElementById("tc").value;
  let rows = DATA.filter(d => (g === "all" || (g === "shallow") === (d.fishing_depth < 40)) && (lk === "all" || d.format === lk) &&
    (tc === "all" || (tc === "yes") === !!d.start_correction) &&
    (!q || [d.OP_ID, d.lake, d.year, d.vessel, d.transect, d.format].join(" ").toLowerCase().includes(q)));
  rows.sort((a, b) => {
    const x = a[sortKey], y = b[sortKey];
    if (x === null || x === undefined) return 1; if (y === null || y === undefined) return -1;
    return (x > y ? 1 : x < y ? -1 : 0) * sortDir || a.year - b.year || a.OP_ID - b.OP_ID;
  });
  const tb = document.querySelector("#tows tbody"); tb.innerHTML = "";
  for (const d of rows) {
    const tr = document.createElement("tr");
    if (d.OP_ID === selected) tr.className = "sel";
    for (const [k, , dec] of COLS) { const td = document.createElement("td"); td.textContent = fmt(d[k], dec); tr.appendChild(td); }
    tr.onclick = () => { selected = d.OP_ID; render(); show(d); };
    tb.appendChild(tr);
  }
  document.getElementById("count").textContent = `${rows.length} of ${DATA.length} tows`;
}
// keep the header row just below the filter bar, whatever its height (it wraps on narrow screens)
const setHeadTop = () => document.getElementById("left").style.setProperty("--controls-h",
  document.querySelector(".controls").offsetHeight + "px");
window.addEventListener("resize", setHeadTop);
new ResizeObserver(setHeadTop).observe(document.querySelector(".controls"));
document.getElementById("q").oninput = render;
document.getElementById("grp").onchange = render;
document.getElementById("lake").onchange = render;
document.getElementById("tc").onchange = render;

function kv(pairs) {
  return '<div class="kv">' + pairs.map(([k, v]) => `<div><span>${k}</span><span>${v}</span></div>`).join("") + "</div>";
}
function img(src, cap) {
  if (!src) return `<div class="img"><div class="cap">${cap}: not available</div></div>`;
  return `<div class="img"><a href="${src}" target="_blank" rel="noopener"><img src="${src}" alt="${cap}" loading="lazy" onerror="this.parentNode.outerHTML='<div class=&quot;cap warn&quot;>image not found: ${src}</div>'"></a><div class="cap">${cap} (click to open full size)</div></div>`;
}
// Bad-data regions (the review's fixes) and the targets they removed: everything else on the page is after masking.
const MASK_COLOR = "#c0392b";
function maskedBlock(m) {
  if (!m) return "";
  const regs = m.regions.map(g => `<tr><td>${g.name}</td><td>${fmt(g.t0, 2)}–${fmt(g.t1, 2)}</td><td>${fmt(g.z0, 1)}–${fmt(g.z1, 1)}</td><td>${g.n}</td><td style="text-align:left;white-space:normal">${g.reason}</td></tr>`).join("");
  const fish = m.fish.map(f => `<tr><td>${f.fish}</td><td>${f.region}</td><td>${f.masked}</td><td>${fmt(f.ts, 2)}</td><td>${fmt(f.above, 1)}</td><td>${fmt(f.depth, 1)}</td><td>${fmt(f.t, 1)}</td></tr>`).join("");
  return `<div class="small warn" style="margin-top:10px"><b>Bad-data regions</b> (automatic: fish tracks with mean TS above −35 dB, padded 2 s and 1 m; config/bad_data_regions/).
    The plots and numbers above are after masking; the targets inside the regions (whole column, before masking) are drawn in red (×) and listed here.</div>
  <table class="mini small"><thead><tr><th>Region</th><th>Time min</th><th>Depth m</th><th>Targets</th><th style="text-align:left">Reason</th></tr></thead><tbody>${regs}</tbody></table>
  <div class="small" style="margin-top:6px">Tracks with targets inside the regions (TS: mean of all the track's targets; "− median": against the fish median above):</div>
  <table class="mini small"><thead><tr><th>Fish</th><th>Region</th><th>Targets masked</th><th>TS</th><th>− median</th><th>Depth m</th><th>Time min</th></tr></thead>
  <tbody>${fish || '<tr><td colspan="7">no targets used inside the regions</td></tr>'}</tbody></table>`;
}
const LAYOUT = { margin: { l: 52, r: 12, t: 30, b: 42 }, font: { size: 11 }, paper_bgcolor: "#fff", plot_bgcolor: "#fff" };
const CFG = { responsive: true, displaylogo: false };

function show(d) {
  const R = document.getElementById("right");
  const strongRows = d.strongest.map(s => `<tr><td>${fmt(s.ts, 2)}</td><td>${fmt(s.tsmax, 1)}</td><td>${s.n}</td><td>${fmt(s.depth, 1)}</td><td>${fmt(s.t, 1)}</td></tr>`).join("");
  R.innerHTML = `
  <h2>Tow ${d.OP_ID}${d.start_correction ? ' <span class="tc-tag">Time corrected</span>' : ''}</h2>
  ${d.start_correction ? `<div class="tc-note">Start time corrected: ${d.start_correction.replace(/&/g, '&amp;').replace(/</g, '&lt;')}</div>` : ''}
  <div class="sub">Lake Michigan ${d.year}, vessel ${d.vessel}, transect ${d.transect}, ${d.format}; tow region ${fmt(d.fishing_depth, 1)}–${fmt(d.region_bottom, 1)} m depth; transducer ${fmt(d.transducer_depth, 2)} m. Times below: minutes from the tow start (data-file clock).</div>
  ${d.review ? `<div class="decision"><div><b>In the sample as:</b> ${d.review.why_in_sample}</div>
    <div><b>Decision:</b> ${d.review.decision}</div><div><b>Why:</b> ${d.review.rationale}</div></div>` : ""}

  <h3>1. Bottom detection</h3>
  <div class="plots"><div id="p_tgt" class="plot wide" style="height:380px"></div></div>
  ${kv([["Bottom (pydt4 Maximum Sv line) in tow window, min / median m", `${fmt(d.bottom_min_window, 2)} / ${fmt(d.bottom_median_window, 2)}`],
        ["Shallowest bottom − region bottom (m)", fmt(d.bottom_clearance, 2)],
        ["Region pings without a bottom pick", fmt(d.no_pick_pings, 0)], ["Largest ping-to-ping change of the line (m)", fmt(d.bottom_max_jump, 2)],
        ["Tow run: shallowest pick in the region's pings (m)", fmt(d.p_bottom_min, 2)],
        ["Tow run: bad picks", fmt(d.p_bad_picks, 0)],
        ["Tow run: share of region below the line", fmt(d.p_frac_masked, 4)]])}
  <div class="plots" style="margin-top:8px"><div class="wide">${img(d.img_sv, "pydt4 Sv echogram (tow region magenta, bottom line white, tow-region single targets)")}</div></div>

  <h3>2. Large targets</h3>
  <div class="plots"><div id="p_det" class="plot"></div><div id="p_fish" class="plot"></div></div>
  <div class="small">Targets used: whole-column single targets in the tow region, −60 to −30 dB, outside the bad-data regions. Fish: gap-0 tracks holding targets used.</div>
  ${kv([["Mean TS_comp, targets used (dB)", fmt(d.ts_mean, 2)], ["Median TS_comp (dB)", fmt(d.ts_median, 2)],
        ["Mean − median (dB)", fmt(d.mean_minus_median, 2)], ["Strongest target in region, all TS (dB)", fmt(d.ts_max_region, 1)],
        ["Median of fish (track means, dB)", fmt(d.fish_median, 2)], ["Strongest fish − fish median (dB)", fmt(d.strongest_fish_above_median, 1)],
        ["Tow run (tow region): targets / mean TS (dB)", `${fmt(d.st_n_targets_run, 0)} / ${fmt(d.st_mean_ts_run, 2)}`]])}
  <div class="small" style="margin-top:6px">Strongest fish (tracks, targets used):</div>
  <table class="mini small"><thead><tr><th>Mean TS</th><th>Max TS</th><th>Targets</th><th>Depth m</th><th>Time min</th></tr></thead><tbody>${strongRows || '<tr><td colspan="5">no tracks</td></tr>'}</tbody></table>
  ${maskedBlock(d.masked)}

  <h3>3. Crowding</h3>
  ${kv([["Nv, tow (pydt4)", fmt(d.nv_pydt4, 4)], ["Share of pings with Nv > 0.1 (pydt4)", fmt(d.nv_frac_pings, 3)],
        ["Single targets per ping (tow run)", fmt(d.targets_per_ping, 2)],
        ["Share of targets used in tracks", fmt(d.frac_in_tracks, 3)], ["Region mean Sv (dB, noise removed)", fmt(d.sv_mean, 2)]])}

  <h3>4. Target number</h3>
  ${kv([["Targets used", fmt(d.targets_used, 0)], ["Fish (tracks)", fmt(d.fish_tracks, 0)],
        ["Fish with 1 target used (track partly outside the tow region)", fmt(d.fish_1, 0)], ["Fish with 2 targets", fmt(d.fish_2, 0)], ["3–4 targets", fmt(d.fish_3_4, 0)], ["5–9 targets", fmt(d.fish_5_9, 0)], ["10+ targets", fmt(d.fish_10plus, 0)]])}

  <h3>5. Tow timing and coverage</h3>
  ${kv([["Logged start (tow list)", fmt(d.logged_start)], ["Tow duration (min)", fmt(d.tow_minutes, 1)],
        ["Start time correction", d.start_correction || "none"], ["Data-clock offset (vessel-year)", d.clock_offset || "none"], ["Tow window start (file clock)", fmt(d.window_start_file_clock)],
        ["Match level", fmt(d.match_level)], ["Data files", fmt(d.n_files, 0)],
        ["Data before the window (min)", fmt(d.data_before_min, 1)], ["Data after the window (min)", fmt(d.data_after_min, 1)],
        ["Vessel speed over the window (kn; trawling ~2–3)", fmt(d.speed_kn, 1)],
        ["Pings in the window", fmt(d.pings_in_window, 0)], ["Median ping interval (s)", fmt(d.ping_interval_s, 3)],
        ["Irregular ping intervals", fmt(d.irregular_intervals, 0)], ["Longest ping interval (s)", fmt(d.max_interval_s, 2)]])}

  <h3>6. Catch</h3>
  ${kv([["Catch (species code: N)", d.catch_text || "–"], ["Alewife measured", fmt(d.alewife_n, 0)],
        ["Median alewife length (mm)", fmt(d.alewife_len_median, 0)], ["Largest alewife (mm)", fmt(d.alewife_len_max, 0)]])}
  <div class="plots"><div id="p_len" class="plot"></div></div>`;

  if (typeof Plotly === "undefined") {
    for (const id of ["p_tgt", "p_det", "p_fish", "p_len"]) document.getElementById(id).innerHTML = '<div class="empty warn">Plotly did not load (no internet?): the interactive plots need it.</div>';
    return;
  }
  // targets and bottom line
  const P = d.pts, tr = P.tr;
  const sel = f => P.t.map((_, i) => i).filter(f);
  const tracked = sel(i => tr[i] === 1), other = sel(i => tr[i] !== 1);
  const pt = (idx, name, size, sym) => ({
    type: "scattergl", mode: "markers", name, x: idx.map(i => P.t[i]), y: idx.map(i => P.z[i]),
    text: idx.map(i => `TS ${P.ts[i]} dB`), hovertemplate: "%{x:.2f} min, %{y:.2f} m<br>%{text}<extra>" + name + "</extra>",
    marker: { size, symbol: sym, color: idx.map(i => P.ts[i]), colorscale: "Jet", cmin: -60, cmax: -25,
              colorbar: name === "in tracks" ? { title: { text: "TS dB" }, thickness: 10, len: 0.9 } : undefined, showscale: name === "in tracks" }
  });
  const M = d.masked;
  const mTrace = M && M.ts.length ? [{ type: "scatter", mode: "markers", name: `masked (${M.ts.length})`, x: M.t, y: M.z,
    text: M.ts.map((v, i) => `TS ${v} dB<br>${M.lab[i]}`), hovertemplate: "%{x:.2f} min, %{y:.2f} m<br>%{text}<extra>masked</extra>",
    marker: { size: 9, symbol: "x-thin-open", color: MASK_COLOR, line: { width: 2, color: MASK_COLOR } } }] : [];
  const mBoxes = M ? M.regions.map(g => ({ type: "rect", x0: g.t0, x1: g.t1, y0: g.z0, y1: g.z1, line: { color: MASK_COLOR, width: 1.5 } })) : [];
  Plotly.newPlot("p_tgt", [
    pt(other, "not in tracks", 4, "circle-open"), pt(tracked, "in tracks", 5, "circle"), ...mTrace,
    { type: "scatter", mode: "lines", name: "bottom line", x: d.bline.t, y: d.bline.z, line: { color: "#2a9d3a", width: 1.5 } }
  ], { ...LAYOUT, title: { text: "Single targets (tow window, whole water column ≥ 5 m, no TS ceiling) and the bottom line" + (M ? "; red: bad-data regions" : ""), font: { size: 12 } },
       xaxis: { title: "minutes from tow start" }, yaxis: { title: "depth (m)", autorange: "reversed" },
       legend: { orientation: "h", y: -0.18 },
       shapes: [{ type: "rect", x0: 0, x1: d.window_min, y0: d.fishing_depth, y1: d.region_bottom, line: { color: "#333", width: 1, dash: "dot" } }, ...mBoxes] }, CFG);
  // per detection
  const bins = { start: -60, end: -20, size: 1 };
  Plotly.newPlot("p_det", [
    { type: "histogram", x: d.hist_all, xbins: bins, name: `all (${d.hist_all.length})`, marker: { color: "#b9c3c8" } },
    { type: "histogram", x: d.hist_tracked, xbins: bins, name: `in tracks (${d.hist_tracked.length})`, marker: { color: "#41525b" } },
    ...(M && M.ts.length ? [{ type: "histogram", x: M.ts, xbins: bins, name: `masked (${M.ts.length})`, marker: { color: MASK_COLOR, opacity: 0.75 } }] : [])
  ], { ...LAYOUT, barmode: "overlay", title: { text: "Targets used, per detection", font: { size: 12 } },
       xaxis: { title: "TS_comp (dB)", range: [-61, -25] }, yaxis: { title: "count" }, legend: { x: 0.02, y: 0.98 } }, CFG);
  // per fish
  Plotly.newPlot("p_fish", [
    { type: "histogram", x: d.fish_ts, xbins: bins, name: `fish (${d.fish_ts.length})`, marker: { color: "#5b8fb0" },
      hovertemplate: "%{x} dB: %{y} fish<extra></extra>" },
    ...(M && M.fish.length ? [{ type: "histogram", x: M.fish.map(f => f.ts), xbins: bins, name: `masked (${M.fish.length})`,
      marker: { color: MASK_COLOR }, hovertemplate: "%{x} dB: %{y} masked fish<extra></extra>" }] : [])
  ], { ...LAYOUT, barmode: "overlay", title: { text: "Fish (track mean TS, ≥ 2 targets)" + (M && M.fish.length ? "; red: masked" : ""), font: { size: 12 } },
       xaxis: { title: "TS_comp (dB)", range: [-61, -25] }, yaxis: { title: "fish" }, showlegend: false,
       shapes: [...(d.fish_median === null ? [] : [{ type: "line", x0: d.fish_median, x1: d.fish_median, y0: 0, y1: 1, yref: "paper", line: { color: "#333", dash: "dot" } }]),
                { type: "line", x0: -35, x1: -35, y0: 0, y1: 1, yref: "paper", line: { color: MASK_COLOR, dash: "dot" } }],
       annotations: [...(d.fish_median === null ? [] : [{ x: d.fish_median, y: 1, yref: "paper", text: "median", showarrow: false, yanchor: "bottom", font: { size: 10 } }]),
] }, CFG);
  // alewife lengths caught
  Plotly.newPlot("p_len", [{ type: "histogram", x: d.alewife_len, xbins: { start: 0, end: 260, size: 5 }, marker: { color: "#2a9d3a" } }],
    { ...LAYOUT, title: { text: `Alewife lengths caught (${d.alewife_n})`, font: { size: 12 } }, xaxis: { title: "total length (mm)", range: [0, 260] }, yaxis: { title: "fish" } }, CFG);
}
render();
</script>
</body>
</html>
